<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - NexEvent</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f7;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 400px;
        }

        input, select {
            border-radius: 12px !important;
        }

        .btn-rounded {
            border-radius: 25px;
            padding: 8px 22px;
        }

        .brand {
            font-weight: 600;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .register-link {
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="login-card text-center">

    <div class="brand">NexEvent</div>
    <h5 class="mb-4">Login to your account</h5>

    <form method="post">
        {% csrf_token %}
        {% for field in form %}
    <div class="mb-3 text-start">
        <label class="form-label fw-semibold">
            {{ field.label }}
        </label>

        {{ field }}

        {% if field.errors %}
            <div class="text-danger small mt-1">
                {{ field.errors }}
            </div>
        {% endif %}
    </div>
{% endfor %}

        <button type="submit"
                class="btn btn-dark w-100 mt-3 btn-rounded">
            Login
        </button>
    </form>

    <p class="mt-4 register-link">
        New customer?
        <a href="{% url 'register' %}" class="text-decoration-none fw-semibold">
            Register here
        </a>
    </p>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
