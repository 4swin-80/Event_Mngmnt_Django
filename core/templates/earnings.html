<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Earnings Report</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f7;
        }

        .navbar {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .summary-card {
            background: #111;
            color: white;
            border-radius: 20px;
            padding: 25px;
            font-size: 20px;
            font-weight: 500;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .salary-card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.05);
            transition: 0.3s ease;
        }

        .salary-card:hover {
            box-shadow: 0 12px 25px rgba(0,0,0,0.08);
        }

        .amount {
            font-weight: 600;
        }

        .paid-date {
            font-size: 13px;
            color: #6c757d;
        }

        .btn-rounded {
            border-radius: 25px;
            padding: 6px 18px;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container-fluid px-4">
        <span class="navbar-brand fw-semibold">NexEvent</span>

        <div class="d-flex gap-3">
            <a href="{% url 'operator_dashboard' %}" class="text-decoration-none">
                Dashboard
            </a>
            <a href="{% url 'logout' %}" class="text-danger text-decoration-none">
                Logout
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4 mb-5">

    <h4 class="mb-4 text-center">My Earnings</h4>
    <hr>
    <br>

    <!-- Monthly Summary -->
    <div class="summary-card mb-5">
        💰 Monthly Total: ₹{{ monthly_total }}
    </div>

    <div class="row g-4">

        {% for s in salaries %}
        <div class="col-lg-6">
            <div class="salary-card">

                <div class="d-flex justify-content-between mb-2">
                    <span>Base Salary</span>
                    <span class="amount">₹{{ s.base_amount }}</span>
                </div>

                <div class="d-flex justify-content-between mb-2">
                    <span>Bonus</span>
                    <span class="amount">₹{{ s.bonus }}</span>
                </div>

                <hr>

                <div class="d-flex justify-content-between mb-2">
                    <strong>Total Paid</strong>
                    <strong class="amount text-success">
                        ₹{{ s.total_amount }}
                    </strong>
                </div>

                <div class="paid-date">
                    Paid on: {{ s.paid_date }}
                </div>

            </div>
        </div>

        {% empty %}
            <div class="text-muted">
                No salary records.
            </div>
        {% endfor %}

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
