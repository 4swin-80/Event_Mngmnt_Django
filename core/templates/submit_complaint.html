<!DOCTYPE html>
<html>
<head>
    <title>Submit Complaint</title>

    <style>
        .btn {
            padding: 6px 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<h2>Submit Complaint</h2>

<a href="{% url 'view_complaints' %}">Back to My Complaints</a>
<hr>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Submit</button>
</form>

</body>
</html>
