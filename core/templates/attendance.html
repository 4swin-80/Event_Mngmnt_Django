<!DOCTYPE html>
<html>
<head>
    <title>Attendance</title>
</head>
<body>

<h1>Attendance Records</h1>

<a href="{% url 'admin_dashboard' %}">Back to Dashboard</a> |
<a href="{% url 'logout' %}">Logout</a>

<hr>

{% for a in attendance %}
    <div>
        {{ a.operator.username }} |
        {{ a.event.name }} |
        {{ a.status }} |
        {{ a.check_in_time }}
    </div>
    <hr>
{% empty %}
    <p>No attendance records.</p>
{% endfor %}

</body>
</html>
