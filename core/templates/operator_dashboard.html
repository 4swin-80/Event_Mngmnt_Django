<!DOCTYPE html>
<html>
<head>
    <title>Operator Dashboard</title>
    {% load static %}

    <style>
        @keyframes blink {
            0% {opacity:1;}
            50% {opacity:0;}
            100% {opacity:1;}
        }

        .alert {
            color: red;
            font-size: 24px;
            animation: blink 1s infinite;
        }
    </style>
</head>
<body>

<h1>Operator Dashboard</h1>

<p>
    Welcome {{ user.username }} |
    <a href="{% url 'logout' %}">Logout</a> |
    <a href="{% url 'earnings' %}">Earnings</a> 
</p>

<hr>

<h3>Attendance</h3>
<a href="{% url 'check_in' %}">🟢 Check In</a>
<a href="{% url 'check_out' %}">🔴 Check Out</a>

<hr>

<h3>Pending Cues</h3>

{% for cue in cues %}
    <div>
        <strong>{{ cue.cue_action }}</strong>
        ({{ cue.cue_time }})
        <a href="{% url 'complete_cue' cue.id %}">✅ Mark Completed</a>
    </div>
{% empty %}
    <p>No pending cues.</p>
{% endfor %}

<hr>

<h3>Live Alerts</h3>
<div id="alerts"></div>

<script>
const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
const socket = new WebSocket(protocol + window.location.host + "/ws/alerts/");

const soundUrl = "{% static 'audio/smooth_notification.mp3' %}";
let audioUnlocked = false;

// Create reusable audio object
const audio = new Audio(soundUrl);
audio.preload = "auto";

// Unlock audio on first user click
document.addEventListener("click", function unlock() {
    audio.play()
        .then(() => {
            audio.pause();
            audio.currentTime = 0;
            audioUnlocked = true;
            console.log("🔓 Audio unlocked");
        })
        .catch(err => console.log("Unlock failed:", err));

    document.removeEventListener("click", unlock);
});

// Play sound safely
function playSound() {
    if (!audioUnlocked) {
        console.log("Audio not unlocked yet");
        return;
    }

    audio.currentTime = 0;
    audio.play().catch(err => console.log("Play blocked:", err));
}


// When WebSocket receives alert
socket.onmessage = function(e) {
    const data = JSON.parse(e.data);

    const alertDiv = document.createElement("div");
    alertDiv.className = "alert";
    alertDiv.innerHTML = data.message;

    document.getElementById("alerts").appendChild(alertDiv);

    playSound();
};

socket.onopen = function() {
    console.log("WebSocket connected ✅");
};

socket.onerror = function(e) {
    console.log("WebSocket error ❌", e);
};

socket.onclose = function() {
    console.log("WebSocket disconnected");
};
</script>

</body>
</html>
