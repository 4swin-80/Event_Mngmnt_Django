<!DOCTYPE html>
<html>
<head>
    <title>Operator Dashboard</title>
</head>
<body>

{% load static %}

<h1>Operator Dashboard</h1>

<p>Welcome {{ user.username }} |
<a href="{% url 'logout' %}">Logout</a></p>

<hr>

<h3>Pending Cues</h3>

{% for cue in cues %}
    <div>
        <strong>{{ cue.cue_action }}</strong>
        ({{ cue.cue_time }})
    </div>
{% empty %}
    <p>No pending cues.</p>
{% endfor %}

<hr>

<h3>Live Alerts</h3>
<div id="alerts"></div>

<audio id="alertSound" preload="auto">
    <source src="{% static 'audio/smooth_notification.mp3' %}" type="audio/mpeg">
</audio>

<script>
const socket = new WebSocket(
    'ws://' + window.location.host + '/ws/alerts/'
);

// Unlock autoplay
document.body.addEventListener('click', function() {
    const sound = document.getElementById("alertSound");
    sound.play().then(() => {
        sound.pause();
        sound.currentTime = 0;
    }).catch(() => {});
}, { once: true });

socket.onmessage = function(e) {
    const data = JSON.parse(e.data);

    const alertDiv = document.createElement("div");
    alertDiv.innerHTML = data.message;
    alertDiv.style.color = "red";
    alertDiv.style.fontSize = "24px";
    alertDiv.style.animation = "blink 1s infinite";

    document.getElementById("alerts").appendChild(alertDiv);

    const sound = document.getElementById("alertSound");
    sound.currentTime = 0;
    sound.play();
};
</script>

<style>
@keyframes blink {
    0% {opacity:1;}
    50% {opacity:0;}
    100% {opacity:1;}
}
</style>

</body>
</html>
