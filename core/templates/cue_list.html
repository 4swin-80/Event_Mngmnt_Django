<!DOCTYPE html>
<html>
<head>
    <title>Cue List</title>
</head>
<body>

<h1>All Cues</h1>

<a href="{% url 'admin_dashboard' %}">Back to Dashboard</a> |
<a href="{% url 'logout' %}">Logout</a>

<hr>

{% for cue in cues %}
    <div>
        <strong>{{ cue.cue_action }}</strong> |
        Event: {{ cue.event.name }} |
        Operator: {{ cue.operator.username }} |
        Date: {{ cue.cue_date }} |
        Time: {{ cue.cue_time }} |
        Status: {{ cue.cue_status }}
    </div>
    <hr>
{% empty %}
    <p>No cues available.</p>
{% endfor %}

</body>
</html>
