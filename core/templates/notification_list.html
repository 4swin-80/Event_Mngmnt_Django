<!DOCTYPE html>
<html>
<head>
    <title>Notifications</title>
</head>
<body>

<h1>Notifications</h1>

<a href="{% url 'admin_dashboard' %}">Back to Dashboard</a> |
<a href="{% url 'logout' %}">Logout</a>

<hr>

{% for n in notifications %}
    <div>
        <strong>{{ n.cue.cue_action }}</strong> |
        Alert Time: {{ n.alert_time }} |
        Status: {{ n.alert_status }}
    </div>
    <hr>
{% empty %}
    <p>No notifications available.</p>
{% endfor %}

</body>
</html>
