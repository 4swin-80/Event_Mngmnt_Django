<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Performance Analytics</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f7;
        }

        .navbar {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .analytics-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            transition: 0.3s ease;
        }

        .analytics-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
        }

        .task-count {
            font-size: 26px;
            font-weight: 600;
        }

        .operator-name {
            font-weight: 500;
            color: #555;
        }

        .rank-badge {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .btn-rounded {
            border-radius: 25px;
            padding: 6px 18px;
        }
    </style>
</head>
<body>

<!-- Admin Navbar -->
<nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container-fluid px-4">
        <span class="navbar-brand fw-semibold">Admin Panel</span>

        <div class="d-flex gap-3">
            <a href="{% url 'admin_dashboard' %}" class="text-decoration-none">
                Dashboard
            </a>
            <a href="{% url 'logout' %}" class="text-danger text-decoration-none">
                Logout
            </a>
        </div>
    </div>
</nav>

<div class="container-fluid px-4 mt-4 mb-5">

    <h4 class="mb-4">Performance Analytics</h4>

    <div class="row g-4">

        {% for item in data %}
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="analytics-card text-center">

                <div class="operator-name mb-2">
                    {{ item.operator__username }}
                </div>

                <div class="task-count">
                    {{ item.total_tasks }}
                </div>

                <div class="text-muted">
                    Tasks Completed
                </div>

            </div>
        </div>

        {% empty %}
            <div class="text-muted">
                No performance data available.
            </div>
        {% endfor %}

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
